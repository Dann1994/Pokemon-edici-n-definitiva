name: Release (Edición Definitiva)

# The pokered-plus fork's own release: Windows installer + portable zip,
# Android APK, and the shared game.love the in-game updater pulls
# (src/update/Check.lua -> this repo's releases/latest).
#
# Cut a release by pushing a tag:  git tag v1.2.3 && git push origin v1.2.3
# or from the Actions tab (Run workflow, type the version).
#
# Asset names are a contract with the updater and must not change:
#   gen1recomp-X.Y.Z.love            in-place payload (every platform)
#   sha256sums.txt                   checksums the updater verifies
#   gen1recomp-X.Y.Z-windows.zip     full Windows package (portable)
#   gen1recomp-X.Y.Z-android.apk     full Android package (self-installs)
# plus PokemonEdicionDefinitiva-X.Y.Z-instalador.exe for first installs.
#
# Upstream's release.yml (macOS runner, ten platforms) stays untouched; it
# only fires on `main`, which this fork does not use.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-plus
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_VERSION:-}" ]; then v="$DISPATCH_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not an X.Y.Z version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  payload:
    name: game.love
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip
      - name: Pack
        run: |
          set -euo pipefail
          scripts/pack_love.sh --output dist/payload/game.love \
            --listing dist/payload/listing.txt --version "${{ needs.version.outputs.version }}"
      - name: The fork's mods made it in, no ROM data did
        run: |
          set -euo pipefail
          for m in pokered_plus es_es es_419 mew_event oak_event; do
            grep -qx "mods/$m/manifest.json" dist/payload/listing.txt \
              || { echo "::error::game.love is missing mods/$m"; exit 1; }
          done
          if grep -Eq '\.(gb|gbc|gba|sav)$|^(data|assets)/generated/.' dist/payload/listing.txt; then
            echo "::error::game.love carries ROM-derived data"; exit 1
          fi
          unzip -p dist/payload/game.love src/core/Version.lua | grep -F 'engine = "${{ needs.version.outputs.version }}"'
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: dist/payload/game.love
          if-no-files-found: error

  windows:
    name: Windows build
    needs: [version, payload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: payload
          path: dist/payload
      - name: Tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip imagemagick
          # build.sh calls ImageMagick 7's `magick`; Ubuntu ships 6 (`convert`)
          command -v magick >/dev/null || sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          # optional: brands the exe icon (build.sh falls back to LÖVE's)
          pipx install pe_tools || true
      - name: Build
        run: |
          set -euo pipefail
          scripts/build.sh win --version "${{ needs.version.outputs.version }}" \
            --game-love dist/payload/game.love
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/win/gen1recomp-win64.zip
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: [version, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: windows-zip
          path: dist/win
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive dist/win/gen1recomp-win64.zip -DestinationPath dist/win/unz
          $src = (Resolve-Path dist/win/unz/gen1recomp-win64).Path
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          $out = (Resolve-Path dist/installer).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceDir=$src" "/DOutputDir=$out" installer/edicion_definitiva.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already carries the Android SDK; android-actions/
      # setup-android@v3 died asking sdkmanager for the long-removed `tools`.
      - name: SDK packages
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sm="$(ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "using $sm"
          yes | "$sm" --licenses >/dev/null || true
          "$sm" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          # Every release MUST be signed with the same key, or Android refuses
          # to install it over the previous one (the self-update breaks).
          [ -n "$KEYSTORE_B64" ] || { echo "::error::secret ANDROID_RELEASE_KEYSTORE_B64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build
        env:
          GEN1RECOMP_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          GEN1RECOMP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          GEN1RECOMP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GEN1RECOMP_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          scripts/build_android.sh --release --version "${{ needs.version.outputs.version }}"
          ls -la dist/android/release/
          n=$(ls dist/android/release/*.apk | wc -l)
          [ "$n" -eq 1 ] || { echo "::error::expected one release APK, found $n"; exit 1; }
          apk="$(ls dist/android/release/*.apk)"
          for m in pokered_plus es_es mew_event oak_event; do
            unzip -p "$apk" assets/game.love > /tmp/g.love
            unzip -Z1 /tmp/g.love | grep -qx "mods/$m/manifest.json" \
              || { echo "::error::APK game.love is missing mods/$m"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/android/release/*.apk
          if-no-files-found: error

  release:
    name: publish
    needs: [version, payload, windows, installer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          path: art
      - name: Name assets for the updater + checksums
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir out
          cp art/payload/game.love            "out/gen1recomp-$v.love"
          cp art/windows-zip/gen1recomp-win64.zip "out/gen1recomp-$v-windows.zip"
          cp art/android-apk/*.apk            "out/gen1recomp-$v-android.apk"
          cp art/installer/*.exe              "out/PokemonEdicionDefinitiva-$v-instalador.exe"
          (cd out && sha256sum * > sha256sums.txt)
          cat out/sha256sums.txt
      - name: Release notes
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          prev="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "v$v" | head -1 || true)"
          {
            echo "## Pokémon Edición Definitiva $v"
            echo
            echo "**PC (Windows):** descargá \`PokemonEdicionDefinitiva-$v-instalador.exe\`."
            echo "**Android:** descargá \`gen1recomp-$v-android.apk\` (permití instalar apps de origen desconocido)."
            echo
            echo "Necesitás tu propia ROM de Pokémon Rojo (.gb); el juego la pide la primera vez."
            echo "Si ya lo tenés instalado, el juego avisa solo que hay una actualización."
            echo
            echo "### Cambios"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..HEAD"
            else
              echo "- Primera versión."
            fi
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" out/* --clobber
            gh release edit "v$v" --notes-file notes.md
          else
            gh release create "v$v" out/* --title "Pokémon Edición Definitiva $v" \
              --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
